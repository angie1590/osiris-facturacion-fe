name: Temporary Frontend Audit Suite

on:
  push:
    branches:
      - audit/test-run-20261028-fe

permissions:
  contents: read

jobs:
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and component tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
